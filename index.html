<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123047" />
    <meta name="description" content="ERP EnterpriseCloud" />
    <script>
      try {
        if (localStorage.getItem("enterprisecloud.theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#101a22");
        }
      } catch (_) {}
    </script>
    <title>EnterpriseCloud | ERP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
